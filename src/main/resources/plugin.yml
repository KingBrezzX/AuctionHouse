name: AuctionHouse
version: 1.0.0
main: com.kingbrezz.auctionhouse.AuctionHousePlugin
api-version: '1.21'
folia-supported: true

author: KingBrezz
description: Modern Auction House for Paper 26.2 and Java 25.

softdepend:
  - Vault

commands:
  ah:
    description: Open the Auction House
    usage: /ah [reload]
    aliases:
      - auctionhouse

permissions:
  auctionhouse.use:
    description: Open the Auction House
    default: true

  auctionhouse.sell:
    description: Sell items on the Auction House
    default: true

  auctionhouse.buy:
    description: Buy items from the Auction House
    default: true

  auctionhouse.admin:
    description: Reload and manage Auction House
    default: op

  auctionhouse.limit.5:
    description: Allows 5 active Auction House listings
    default: true

  auctionhouse.limit.10:
    description: Allows 10 active Auction House listings
    default: false

  auctionhouse.limit.25:
    description: Allows 25 active Auction House listings
    default: false

  auctionhouse.limit.50:
    description: Allows 50 active Auction House listings
    default: false

  auctionhouse.limit.100:
    description: Allows 100 active Auction House listings
    default: false

  auctionhouse.limit.250:
    description: Allows 250 active Auction House listings
    default: false
