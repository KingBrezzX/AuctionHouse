# ==========================================================
# AuctionHouse
# Author: KingBrezz
# Paper 26.2 / Java 25
# ==========================================================

settings:
  enabled: true

  # How long a listing stays active.
  listing-duration-hours: 48

  # How often expired listings are checked.
  expire-check-seconds: 30

  # Maximum active listings without an extra permission.
  default-listing-limit: 5

  # Highest matching permission wins.
  listing-limits:
    auctionhouse.limit.5: 5
    auctionhouse.limit.10: 10
    auctionhouse.limit.25: 25
    auctionhouse.limit.50: 50
    auctionhouse.limit.100: 100
    auctionhouse.limit.250: 250

  # Tax charged from a successful sale and retained by the server.
  tax-percent: 5.0

pricing:
  # Minimum total listing price.
  minimum-price: 100

  # 100,000,000 = 100m.
  maximum-price: 100000000

  # One-time fee charged when a listing is created.
  listing-fee: 0

  # Accept compact input such as 1k, 1m, 1b and 1t.
  suffix-input: true

restrictions:
  blocked-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - LIGHT

  # Any configured text found in an item's lore blocks listing.
  blocked-lore: []

auction:
  # Players cannot buy their own listing unless changed to true.
  allow-self-purchase: false

  # Expired items go to /ah claims.
  expired-to-claims: true

  # Claims are never deleted because a player's inventory is full.
  protect-claims-on-full-inventory: true

gui:
  browse:
    title: "&8Auction House"
    size: 54

    # 29 slots, similar to the classic 54-slot auction layout.
    item-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43

  my-listings:
    title: "&8My Auctions"
    size: 54

  claims:
    title: "&8Auction Claims"
    size: 54

  sell:
    title: "&8Sell Item"
    size: 27

money-format:
  compact: true
  decimals: 2

  suffixes:
    thousand: "k"
    million: "m"
    billion: "b"
    trillion: "t"
